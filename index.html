/* Ver.2.3: anonymous message-board style inside thread posts only */
#event .posts{background:#fff;color:#111;border-radius:2px;padding:0;margin:12px 0 16px;overflow:hidden;border:1px solid #dce5fa}

</style></head><body><main class="wrap"><h1>🛡️ まにあん掲示板 <span class="admin-badge">ADMIN PANEL</span> <small class="muted">Ver.3.0</small></h1><p class="muted">主人公「まにあんまん」として、30日間の掲示板運営に挑戦！</p><section class="panel"><h2 id="day">1日目 / 30日</h2><div id="timerPanel" style="margin:10px 0 16px"><strong id="timerText">⏱ 残り時間：01:00</strong><div style="height:10px;background:#24334c;border-radius:10px;overflow:hidden;margin-top:8px"><div id="timerBar" style="height:100%;width:100%;background:#43c7a4;transition:width .2s linear"></div></div></div><div class="stats" id="stats"></div></section><div class="board-layout"><div class="board-main"><section class="panel"><h2>📢 今日のスレッド</h2><div class="thread-list" id="threadList"></div><div class="thread-detail" id="threadDetail" hidden><button class="secondary back-button" onclick="closeThread()">← スレッド一覧に戻る</button><div class="event" id="event"></div><h2>管理コマンド</h2><div class="actions" id="moderation"><button class="warn" onclick="moderate('delete')">スレ削除</button><button class="secondary" onclick="moderate('audit')">削除履歴を調査</button></div></div></section><section class="panel event-panel"><h2>⚠️ イベント</h2><div class="event-grid"><div class="random-event"><h2>💌 管理人イベント</h2><div id="ownerEvent" aria-live="polite"></div></div><div class="random-event"><h2>⚡ 不定期イベント</h2><div id="randomEvent" aria-live="polite"></div></div></div></section><section class="panel"><h2>📜 運営ログ</h2><div class="log" id="log"></div></section></div><aside class="panel mascot-panel"><h2>💭 まにあんまんの反応</h2><p id="mascot" aria-live="polite">「今日は何が湧くんだゲー。面倒なのは勘弁だな」</p><div class="day-controls"><button class="green next-day" id="next" onclick="nextDay()">翌日へ進む →</button><p class="muted" id="nextHelp">問題を放置して翌日へ進むと、住民自治が自動で対処する場合があります。</p></div><details class="random-event command-fold" id="sockpuppetPanel"><summary>🎭 自演コマンド</summary><div class="fold-content"><div class="sockpuppet-actions"><button class="sockpuppet-option" onclick="sockpuppet('normal')">普通に盛り上げる <small>成功：活   conflict:{label:'対立煽りを刺激する',success:[8,-6,0,5,0],fail:[0,-4,-8,0,0],penalty:.10,win:'ちょっと煽ったら大炎上したゲー。数字だけは景気がいいな',lose:'対立煽りがバレたゲー。火をつけた本人が燃えてるな'}
 };
 const opt=modes[mode];if(!opt)return;
 s.sockpuppetUsed=true;
 const base=s.safety<20?.90:s.safety<40?.80:s.safety<60?.70:s.safety<80?.60:.50;
 const rate=Math.max(0,base-opt.penalty);
 const won=Math.random()<rate;
 if(won){s.metrics.sockSuccess++;s.metrics.sockGains+=Math.max(0,opt.success[0])+Math.max(0,opt.success[3]);}
 change(...(won?opt.success:opt.fail));
 s.reaction=won?opt.win:opt.lose;
 const delta=won?opt.success:opt.fail;
 const names=['活気','治安・自治','満足度','人口','資金'];
 const summary=delta.map((v,i)=>v?names[i]+' '+(v>0?'+':'')+v:null).filter(Boolean).join('、');
 note('自演「'+opt.label+'」'+(won?'成功':'失敗')+'！ '+summary+'（成功率 '+Math.round(rate*100)+'%）。');
 if(!checkAffection())return;
 render();
}

function applyIgnoredEventPenalties(){
 const normal={
 'ワールドカップ開催':[ -5,-7,-5,0,0],

 '大規模ネット炎上':[5,-12,-10,-5,0],

 '管理人への批判騒動':[3,-8,-10,-3,0]
 };
 const owner={
 '管理人の承認欲求':{bonus:-8,stats:[0,0,0,0,0]},
 '管理人の無駄遣い':{bonus:-7,stats:[0,0,0,0,-5]},

 '管理人の気まぐれ改革':{bonus:-7,stats:[0,0,0,0,0]}
 };
 let ignored=0;
 if(s.randomEvent&&!s.randomEvent.done){let e=s.randomEvent;change(...(normal[e.title]||[0,-5,-5,0,0]));e.done=true;ignored++;note('不定期イベント「'+e.title+'」を未対応で放置。ペナルティ発生。');}
 if(s.ownerEvent&&!s.ownerEvent.done){let e=s.ownerEvent,p=owner[e.title]||{bonus:-7,stats:[0,0,0,0,0]};change(...p.stats);s.affectionBonus=(s.affectionBonus||0)+p.bonus;updateAffection();e.done=true;ignored++;note('管理人イベント「'+e.title+'」を無視。好感度補正 '+p.bonus+'。');}
 if(ignored)s.reaction=ignored===2?'スレもイベントも放置かゲー。管理してるのは誰なんだ？':'イベントを放置したゲー。問題は勝手に解決しないな';
}
function nextDay(){if(dayTransitioning||gameFinished)return;dayTransitioning=true;persistSelected();applyIgnoredEventPenalties();for(let i=0;i<s.threads.length;i++){let t=s.threads[i];if(t.deleted)continue;s.selected=i;for(let k of ['event','handled','removed','banned','audited'])s[k]=t[k];
 const unresolved=(s.event.bad||[]).filter(n=>!s.removed.includes(n));
 const owner=s.event.owner||'';
 if(!unresolved.length&&owner!=='abusive'&&owner!=='overzealous'){
   change(0,0,0,1);note('平和なスレ「'+s.event.title+'」を維持。人口 +1。');
 }else{autoModerate();}
 persistSelected()}s.selected=-1;s.event=null;let income=Math.max(1,Math.floor(s.pop/12)+Math.floor(s.vibe/20));s.money+=income;let delta=Math.round((s.vibe+s.safety+s.happy-150)/45);s.pop=Math.max(0,s.pop+delta);change(-2,0,0);note('広告収益 +'+income+'、人口変動 '+(delta>=0?'+':'')+delta);if(!dailyAffection()){finish(false,'管理人好感度が0になり、契約を解除された。');return}if(s.pop<=0||s.happy<=0||s.safety<=0||s.vibe<=0){finish(false);return}if(s.day>=30){finish(true);return}s.day++;s.sockpuppetUsed=false;s.investmentsUsed=[];choose();spawnRandomEvent();spawnOwnerEvent();s.dayDeadline=Date.now()+60000;dayTransitioning=false;render();updateTimer()}
